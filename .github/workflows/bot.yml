name: Club Bot

on:
  schedule:
    - cron: "37 19 * * *"
  workflow_dispatch:
    inputs:
      force_session:
        description: "Force session regardless of Tyler schedule (testing)"
        required: false
        default: "false"

jobs:
  run-bot:
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            state_cxfan.json
            history_cxfan.json
            cookies_cxfan.json
          key: state-cxfan-${{ github.run_number }}
          restore-keys: |
            state-cxfan-

      - name: Seed cookies from secret
        run: |
          if [ -n "$COOKIES_B64" ]; then
            echo "$COOKIES_B64" | base64 -d > cookies_cxfan.json
            echo "Cookies seeded from secret."
          fi
        env:
          COOKIES_B64: ${{ secrets.COOKIES_CXFAN_B64 }}

      - name: Run bot
        env:
          CLUB_EMAIL: ${{ secrets.CLUB_EMAIL_CXFAN }}
          CLUB_PASSWORD: ${{ secrets.CLUB_PASSWORD_CXFAN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: 6901526627
          FORCE_SESSION: ${{ github.event.inputs.force_session }}
        run: node bot.js

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state_cxfan.json
            history_cxfan.json
            cookies_cxfan.json
          key: state-cxfan-${{ github.run_number }}

      - name: Upload error screenshot if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-${{ github.run_id }}
          path: error.png
